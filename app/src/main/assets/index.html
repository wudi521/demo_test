<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VelaGate</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#efefed;color:#20262b}.app{height:100%;display:flex;flex-direction:column}.top{height:58px;background:#11191f;color:#fff;display:flex;align-items:center;padding:0 12px;box-shadow:0 2px 7px #0004}.logo{width:28px;height:28px;margin-right:10px}.title{font-size:20px;flex:1}.ib{width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:28px;border-radius:50%}.main{flex:1;overflow:auto}.empty{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.drop{width:min(360px,92vw);padding:42px 22px;border:1.5px dashed #a8afb2;border-radius:16px;background:#ffffffb8;text-align:center;color:#737b80}.drop b{color:#0d8c55}.pending{display:none;padding:9px 12px;background:#fff8cf;color:#665a14;font-size:13px}.pending.show{display:block}.list{display:none;background:#fff}.list.show{display:block}.row{height:75px;display:flex;border-bottom:1px solid #d8dcda;background:#fbfbfa}.bar{width:5px;background:#17b26a}.row.pack .bar{background:#9da2a5}.info{flex:1;min-width:0;padding:11px}.name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:#858d91;margin-top:4px}.proto{font-size:10px;color:#dd5a64;margin-top:2px}.acts{display:flex;align-items:center}.ab{width:42px;height:54px;border:0;background:transparent;font-size:20px}.bottom{height:52px;background:#11191f;color:#c9d0d4;display:flex;align-items:center;padding:0 17px;position:relative}.dot{width:8px;height:8px;border-radius:50%;background:#6f777d;margin-right:9px}.bottom.on .dot{background:#17b26a}.fab{position:absolute;right:16px;bottom:27px;width:58px;height:58px;border-radius:50%;border:0;background:#6c7377;color:white;font-size:25px;box-shadow:0 6px 14px #0005}.fab.ready{background:#17b26a}.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#263037ef;color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:22px;z-index:40}.modal.show{display:flex}.card{width:min(380px,96vw);background:#fff;border-radius:18px;padding:20px}.card h3{margin:0 0 16px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#737b80;margin-bottom:5px}.field input{width:100%;height:42px;border:1px solid #cfd4d5;border-radius:10px;padding:0 11px}.buttons{text-align:right;margin-top:16px}.btn{border:0;background:transparent;padding:10px 13px}.primary{color:#0d8c55;font-weight:650}.qr{text-align:center}.qr img{width:230px;height:230px;image-rendering:pixelated}.small{font-size:12px;color:#858d91;margin-top:8px}</style></head><body><div class="app"><header class="top"><svg class="logo" viewBox="0 0 28 28"><path fill="#17b26a" d="M14 2.5 24 6.2l-1.4 12.1L14 25.6 5.4 18.3 4 6.2z"/><path fill="#0e1d24" d="M14 5.8 21 8.4l-1 8.4-6 5.2-6-5.2-1-8.4z"/><path fill="#ecfff6" d="M8.5 10.2h3.1l2.4 4.3 4-7h3.2l-7.3 13.1z"/></svg><div class="title">配置文件</div><button class="ib" id="add">＋</button><button class="ib" id="menu">⋮</button></header><main class="main"><div id="pending" class="pending"></div><div id="list" class="list"></div><div id="empty" class="empty"><div class="drop" id="drop"><h2>拖入配置文件</h2><p>需要 <b>欧洲专线 .conf</b> + <b>流量包 .conf</b><br>也可以点击右上角 <b>+</b> 一次选择两份文件</p></div></div></main><footer id="bottom" class="bottom"><span class="dot"></span><span id="status">未连接</span><button id="connect" class="fab">⌁</button></footer></div><div id="toast" class="toast"></div><div id="edit" class="modal"><div class="card"><h3>编辑节点</h3><div class="field"><label>名称</label><input id="ena ??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function closeM(id){$(id).classList.remove('show')}function render(){let a=[];if(state?.package)a.push(row(state.package,0,'pack'));(state?.nodes||[]).forEach((n,i)=>a.push(row(n,i,'node')));$('list').innerHTML=a.join('');$('list').classList.toggle('show',a.length>0);$('empty').style.display=a.length?'none':'flex';$('connect').classList.toggle('ready',a.length>0);let p='';if(pr&&!pt)p='已识别欧洲专线文件，请继续导入流量包 .conf';if(!pr&&pt)p='已识别流量包文件，请继续导入欧洲专线 .conf';if(waiting)p='配置已校验，正在绑定当前设备…';$('pending').textContent=p;$('pending').classList.toggle('show',!!p)}function row(x,i,t){return `<div class="row ${t==='pack'?'pack':''}"><div class="bar"></div><div class="info"><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.ip)} : ${esc(x.port)}</div><div class="proto">${esc(x.protocol||'VLESS')}</div></div><div class="acts"><button class="ab" onclick="share('${t}',${i})">⌯</button><button class="ab" onclick="editRow('${t}',${i})">✎</button><button class="ab" onclick="del('${t}',${i})">⌫</button></div></div>`}function item(t,i){return t==='pack'?state?.package:state?.nodes?.[i]}function share(t,i){let x=item(t,i);if(!x)return;$('qrnode').textContent=x.name+' · '+x.ip+':'+x.port;$('qr').classList.add('show')}function editRow(t,i){let x=item(t,i);if(!x)return;editing={t,i};$('ename').value=x.name;$('eip').value=x.ip;$('eport').value=x.port;$('edit').classList.add('show')}function del(t,i){if(!state)return;if(t==='pack')state.package=null;else state.nodes.splice(i,1);save();render();toast('已删除')}$('save').onclick=()=>{let x=item(editing.t,editing.i),p=parseInt($('eport').value,10);if(!x||!$('ename').value.trim()||!$('eip').value.trim()||!p){toast('请填写完整');return}x.name=$('ename').value.trim();x.ip=$('eip').value.trim();x.port=p;save();render();closeM('edit');toast('已保存')};window.onNativeConf=(s,f)=>{try{let c=JSON.parse(s);if(state&&(c.fileId===state.routeFileId||c.fileId===state.trafficFileId)){toast('该文件已在本设备解析过');return}if(c.kind==='route'){pr=c;toast('欧洲专线文件校验通过')}else{pt=c;toast('流量包文件校验通过')}render();pair()}catch(e){toast('配置解析失败')}};window.onNativeError=m=>toast(m||'配置无效');function pair(){if(!pr||!pt||waiting)return;if(pt.payload.routeFileId!==pr.fileId){toast('两份配置不匹配');pt=null;render();return}waiting=true;render();Android.activatePair(pr.fileId,pt.fileId)}window.onActivationResult=s=>{waiting=false;let r={ok:false};try{r=JSON.parse(s)}catch(e){}if(!r.ok){toast(r.message||'该配置已在其他设备解析');render();return}let p=pr.payload,t=pt.payload;state={routeFileId:pr.fileId,trafficFileId:pt.fileId,package:{name:t.packageName,ip:t.ip,port:t.port,protocol:t.protocol||'VLESS'},nodes:(p.nodes||[]).map(x=>({...x}))};save();pr=pt=null;render();toast('配置解析成功')};$('add').onclick=()=>Android.pickConfigs();$('drop').onclick=()=>$('add').click();$('menu').onclick=()=>toast('VelaGate · 配置解析器');$('connect').onclick=()=>{let n=(state?.nodes||[]).length+(state?.package?1:0);if(!n){toast('请先解析配置');return}on=!on;$('bottom').classList.toggle('on',on);$('status').textContent=on?'已连接，点击测试连接':'未连接';toast(on?'启动服务成功':'服务已停止')};render();</script></body></html>
