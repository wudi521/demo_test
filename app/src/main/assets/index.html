<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VelaGate</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#efefed;color:#20262b;overscroll-behavior:none}.app{height:100%;display:flex;flex-direction:column}.top{height:58px;flex:0 0 58px;background:#11191f;color:#fff;display:flex;align-items:center;padding:0 12px;box-shadow:0 2px 7px #0004;z-index:5}.logo{width:28px;height:28px;margin-right:10px}.title{font-size:20px;font-weight:600;flex:1}.ib{width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:28px;border-radius:50%}.ib:active,.ab:active{background:#ffffff12}.main{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}.pull{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#707980;font-size:12px;background:#eef0ee;transition:height .18s ease}.pullInner{display:flex;align-items:center;gap:8px;height:48px}.pullIcon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:18px;transition:transform .18s}.pull.ready .pullIcon{transform:rotate(180deg)}.pull.refreshing .pullIcon{font-size:0;border:2px solid #c8cdca;border-top-color:#17b26a;animation:spin .7s linear infinite}.pull.refreshing .pullIcon:before{content:''}@keyframes spin{to{transform:rotate(360deg)}}.empty{height:100%;min-height:360px;display:flex;align-items:center;justify-content:center;padding:24px}.drop{width:min(360px,92vw);padding:46px 22px;border:1.5px dashed #a8afb2;border-radius:16px;background:#ffffffb8;text-align:center;color:#737b80}.drop h2{margin:0 0 8px;color:#30373c;font-size:18px}.drop p{margin:0;font-size:14px;line-height:1.6}.list{display:none;background:#fff}.list.show{display:block}.row{height:77px;display:flex;border-bottom:1px solid #d8dcda;background:#fbfbfa;cursor:pointer}.bar{width:5px;background:#9da2a5}.row.selected .bar{background:#17b26a}.row.package .bar{background:#79838a}.info{flex:1;min-width:0;padding:11px}.name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:#858d91;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.proto{font-size:11px;color:#dd5a64;margin-top:3px;font-variant-numeric:tabular-nums}.row.selected .proto{color:#17a365;font-weight:700}.row.package .proto{color:#607078}.acts{display:flex;align-items:center}.ab{width:42px;height:54px;border:0;background:transparent;font-size:19px}.bottom{height:62px;flex:0 0 62px;background:#11191f;color:#c9d0d4;display:flex;align-items:center;padding:0 17px;position:relative;z-index:4}.dot{width:8px;height:8px;border-radius:50%;background:#6f777d;margin-right:9px}.bottom.on .dot{background:#17b26a;box-shadow:0 0 0 4px #17b26a22}.statusWrap{display:flex;flex-direction:column;gap:2px}.status{font-size:13px}.traffic{font-size:10px;color:#829097;font-variant-numeric:tabular-nums;visibility:hidden}.bottom.on .traffic{visibility:visible;color:#9ccdb6}.fab{position:absolute;right:16px;bottom:31px;width:58px;height:58px;border-radius:50%;border:0;background:#596166;color:white;font-size:25px;box-shadow:0 6px 14px #0005}.fab.ready{background:#17b26a}.fab:active{transform:scale(.96)}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#263037ef;color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;z-index:50;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:22px;z-index:40}.modal.show{display:flex}.card{width:min(380px,96vw);background:#fff;border-radius:18px;padding:20px}.card h3{margin:0 0 16px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#737b80;margin-bottom:5px}.field input{width:100%;height:42px;border:1px solid #cfd4d5;border-radius:10px;padding:0 11px}.buttons{text-align:right;margin-top:16px}.btn{border:0;background:transparent;padding:10px 13px}.primary{color:#0d8c55;font-weight:650}.qr{text-align:center}.qr img{width:230px;height:230px;image-rendering:pixelated}.small{font-size:12px;color:#858d91;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header class="top"><svg class="logo" viewBox="0 0 28 28"><path fill="#17b26a" d="M14 2.5 24 6.2l-1.4 12.1L14 25.6 5.4 18.3 4 6.2z"/><path fill="#0e1d24" d="M14 5.8 21 8.4l-1 8.4-6 5.2-6-5.2-1-8.4z"/><path fill="#ecfff6" d="M8.5 10.2h3.1l2.4 4.3 4-7h3.2l-7.3 13.1z"/></svg><div class="title">VelaGate</div><button class="ib" id="add">＋</button><button class="ib" id="menu">⋮</button></header>
<main class="main" id="main"><div class="pull" id="pull"><div class="pullInner"><span class="pullIcon" id="pullIcon">↓</span><span id="pullText">Pull to refresh</span></div></div><div id="list" class="list"></div><div id="empty" class="empty"><div class="drop" id="drop"><h2>Please add configuration file</h2><p>Drag a .conf file here or tap +</p></div></div></main>
<footer id="bottom" class="bottom"><span class="dot"></span><div class="statusWrap"><span id="status" class="status">Please connect</span><span id="traffic" class="traffic">↓ 0 B  ↑ 0 B</span></div><button id="connect" class="fab">⌁</button></footer>
</div>
<div id="toast" class="toast"></div>
<div id="edit" class="modal"><div class="card"><h3>Edit node</h3><div class="field"><label>Name</label><input id="ename"></div><div class="field"><label>IP address</label><input id="eip"></div><div class="field"><label>Port</label><input id="eport"></div><div class="buttons"><button class="btn" onclick="closeM('edit')">Cancel</button><button class="btn primary" id="save">Save</button></div></div></div>
<div id="qr" class="modal"><div class="card qr"><h3>Share route</h3><img id="qrimg" alt="QR code"><div>This route has been parsed and cannot be parsed again.</div><div id="qrnode" class="small"></div><div class="buttons"><button class="btn primary" onclick="closeM('qr')">Done</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const endpointPool=[['154.40.50.182',23887],['45.88.194.72',31844],['91.205.187.46',15622],['185.225.73.119',24443],['96.126.190.134',39393],['193.29.107.61',27108],['89.58.12.206',18443],['194.87.46.133',32018]];
let state=loadState();let selected=Number.isInteger(state?.selected)?state.selected:-1;let connected=false;let editing=-1;let latencyTimer=null;let totalRx=0,totalTx=0;let refreshY=0,pullDistance=0,refreshing=false;
function emptyState(){return {routeId:null,routeName:null,nodes:[],traffic:null,selected:-1}}
function loadState(){try{let v=JSON.parse(localStorage.getItem('vg.state')||'null');return v||emptyState()}catch(e){return emptyState()}}
function saveState(){state.selected=selected;localStorage.setItem('vg.state',JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);try{Android.toast(m)}catch(e){}}
function closeM(id){$(id).classList.remove('show')}
function hasRoute(){return !!state.routeId&&Array.isArray(state.nodes)&&state.nodes.length>0}
function hasTraffic(){return !!state.traffic&&!!state.traffic.fileId&&state.traffic.routeFileId===state.routeId}
function fullyUnlocked(){return hasRoute()&&hasTraffic()}
function canConnect(){return fullyUnlocked()&&selected>=0&&selected<state.nodes.length}
function randomLatency(){return 50+Math.floor(Math.random()*151)}
function decorateNodes(nodes){return (nodes||[]).map((n,i)=>{let ep=endpointPool[i%endpointPool.length];return {...n,ip:ep[0],port:ep[1],protocol:n.protocol||'VLESS',latency:randomLatency()}})}
function formatBytes(n){n=Math.max(0,Number(n)||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function row(n,i){let sel=i===selected;let proto=sel?(n.latency+' ms'):(n.protocol||'VLESS');return `<div class="row ${sel?'selected':''}" onclick="selectNode(${i})"><div class="bar"></div><div class="info"><div class="name">${esc(n.name)}</div><div class="sub">${esc(n.ip)} : ${esc(n.port)}</div><div class="proto" id="lat-${i}">${esc(proto)}</div></div><div class="acts"><button class="ab" onclick="event.stopPropagation();shareNode(${i})">⌁</button><button class="ab" onclick="event.stopPropagation();editNode(${i})">✎</button><button class="ab" onclick="event.stopPropagation();deleteNode(${i})">⌫</button></div></div>`}
function packageRow(){if(!state.traffic)return '';let name=state.traffic.packageName||state.traffic.name||state.traffic.title||'Traffic Package 1000G';let quota=state.traffic.quotaGb||state.traffic.quotaGB||1000;return `<div class="row package"><div class="bar"></div><div class="info"><div class="name">${esc(name)}</div><div class="sub">${esc(quota)} GB · Europe Route</div><div class="proto">PACKAGE READY</div></div><div class="acts"><button class="ab" onclick="event.stopPropagation();deleteTraffic()">⌫</button></div></div>`}
function render(){if(!Array.isArray(state.nodes))state.nodes=[];if(selected>=state.nodes.length)selected=-1;let html=packageRow()+state.nodes.map(row).join('');$('list').innerHTML=html;$('list').classList.toggle('show',!!html);$('empty').style.display=html?'none':'flex';$('connect').classList.toggle('ready',canConnect()&&!connected);if((!hasRoute()||!hasTraffic())&&connected)disconnect();updateBottom()}
function updateBottom(){$('bottom').classList.toggle('on',connected);if(connected){$('status').textContent='Connected · '+(state.nodes[selected]?.name||'Route');return}$('status').textContent='Please connect';$('traffic').textContent='↓ 0 B  ↑ 0 B'}
function selectNode(i){if(i<0||i>=state.nodes.length)return;if(connected)disconnect();selected=i;state.nodes[i].latency=randomLatency();saveState();render();startLatency()}
function startLatency(){clearInterval(latencyTimer);if(selected<0)return;latencyTimer=setInterval(()=>{if(selected<0||!state.nodes[selected])return;state.nodes[selected].latency=randomLatency();let el=$('lat-'+selected);if(el)el.textContent=state.nodes[selected].latency+' ms'},1100)}
function connectToggle(){if(connected){disconnect();return}if(!hasRoute()){toast('Please add Europe route configuration');return}if(!hasTraffic()){toast('Traffic package configuration is required');return}if(selected<0){toast('Please select a node');return}connected=true;totalRx=0;totalTx=0;updateBottom();render();try{Android.startTrafficProbe()}catch(e){}}
function disconnect(){connected=false;totalRx=0;totalTx=0;try{Android.stopTrafficProbe()}catch(e){}updateBottom();render()}
window.onTrafficSample=function(rx,tx,ok,elapsed){if(!connected)return;totalRx+=Number(rx)||0;totalTx+=Number(tx)||0;$('traffic').textContent=`↓ ${formatBytes(totalRx)}  ↑ ${formatBytes(totalTx)} · ${ok?'online':'checking'}`}
function shareNode(i){let n=state.nodes[i];if(!n)return;$('qrnode').textContent=n.name+' · '+n.ip+':'+n.port;let text='该线路已被解析，不能再次解析。';$('qrimg').src='https://api.qrserver.com/v1/create-qr-code/?size=230x230&margin=8&data='+encodeURIComponent(text);$('qr').classList.add('show')}
function editNode(i){let n=state.nodes[i];if(!n)return;editing=i;$('ename').value=n.name;$('eip').value=n.ip;$('eport').value=n.port;$('edit').classList.add('show')}
$('save').onclick=()=>{if(editing<0||!state.nodes[editing])return;let n=state.nodes[editing];n.name=$('ename').value.trim()||n.name;n.ip=$('eip').value.trim()||n.ip;n.port=parseInt($('eport').value,10)||n.port;saveState();closeM('edit');render()}
function deleteNode(i){if(i<0||i>=state.nodes.length)return;if(connected&&i===selected)disconnect();state.nodes.splice(i,1);if(selected===i)selected=-1;else if(selected>i)selected--;if(state.nodes.length===0){state.routeId=null;state.routeName=null;selected=-1}saveState();render();startLatency()}
function deleteTraffic(){if(connected)disconnect();state.traffic=null;saveState();render();toast('Traffic package removed')}
function resetAll(){if(connected)disconnect();state=emptyState();selected=-1;saveState();render();startLatency()}
window.onNativeConf=function(json,fileName){try{let c=JSON.parse(json),p=c.payload||{};if(c.kind==='route'){if(state.routeId===c.fileId){toast('Configuration already imported');return}if(state.traffic&&state.traffic.routeFileId&&state.traffic.routeFileId!==c.fileId)state.traffic=null;state.routeId=c.fileId;state.routeName=fileName;state.nodes=decorateNodes(p.nodes||[]);selected=-1;saveState();render();toast('Europe route loaded')}else if(c.kind==='traffic'){if(state.traffic&&state.traffic.fileId===c.fileId){toast('Configuration already imported');return}let routeFileId=p.routeFileId;if(state.routeId&&routeFileId!==state.routeId){toast('Traffic package does not match this route');return}state.traffic={...p,fileId:c.fileId,routeFileId:routeFileId,packageName:p.packageName||p.name||p.title||'Traffic Package 1000G'};saveState();render();toast('Traffic package loaded')}}catch(e){toast('Configuration parsing failed')}}
window.onNativeError=function(m){toast(m||'Configuration parsing failed')}
$('add').onclick=()=>{try{Android.pickConfigs()}catch(e){toast('File picker unavailable')}};$('connect').onclick=connectToggle;$('menu').onclick=()=>{if(confirm('Remove all configurations?'))resetAll()}
function setPull(d){pullDistance=Math.max(0,Math.min(92,d));$('pull').style.height=pullDistance+'px';let ready=pullDistance>=62;$('pull').classList.toggle('ready',ready);$('pullText').textContent=ready?'Release to refresh':'Pull to refresh'}
function doRefresh(){if(refreshing)return;refreshing=true;$('pull').classList.remove('ready');$('pull').classList.add('refreshing');$('pull').style.height='48px';$('pullText').textContent='Refreshing...';setTimeout(()=>{if(selected>=0&&state.nodes[selected])state.nodes[selected].latency=randomLatency();saveState();render();$('pull').classList.remove('refreshing');$('pullText').textContent='Updated';setTimeout(()=>{$('pull').style.height='0px';setTimeout(()=>{$('pullText').textContent='Pull to refresh';refreshing=false},180)},350)},850)}
$('main').addEventListener('touchstart',e=>{if(refreshing||$('main').scrollTop>0)return;refreshY=e.touches[0].clientY;pullDistance=0},{passive:true});
$('main').addEventListener('touchmove',e=>{if(refreshing||refreshY===0||$('main').scrollTop>0)return;let d=(e.touches[0].clientY-refreshY)*.56;if(d>0){e.preventDefault();setPull(d)}},{passive:false});
$('main').addEventListener('touchend',()=>{if(refreshing){refreshY=0;return}let ready=pullDistance>=62;refreshY=0;if(ready)doRefresh();else{$('pull').style.height='0px';$('pull').classList.remove('ready');$('pullText').textContent='Pull to refresh'}pullDistance=0},{passive:true});
render();startLatency();
</script>
</body>
</html>
