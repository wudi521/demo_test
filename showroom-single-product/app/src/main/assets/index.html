<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>单商品体验版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033}button,input,textarea{font:inherit}.app{min-height:100vh}.top{padding:18px 16px 14px;background:#fff;border-bottom:1px solid #e8edf4}.row{display:flex;align-items:center;gap:10px}.top h1{margin:0;font-size:20px}.tag{margin-left:auto;background:#ecfdf3;color:#15803d;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}.sub{font-size:11px;color:#7b8798;margin-top:3px}.content{padding:14px 14px 94px}.hero{padding:18px;background:linear-gradient(135deg,#18294f,#2a5de1);color:#fff;border-radius:18px;margin-bottom:13px}.hero h2{margin:0 0 6px;font-size:21px}.hero p{margin:0;font-size:12px;line-height:1.65;color:#dbe5ff}.card{background:#fff;border:1px solid #e8edf4;border-radius:16px;padding:15px;margin-bottom:12px}.card h3{font-size:15px;margin:0 0 12px}.field{margin-bottom:12px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:12px;color:#5f6d81;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #e8edf4;border-radius:11px;padding:10px 11px;background:#fbfdff;outline:none;font-size:16px}.field textarea{min-height:82px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{border:1.5px dashed #c7d2e1;border-radius:14px;padding:18px;text-align:center;background:#fafcff}.upload strong{display:block;font-size:14px;margin-bottom:4px}.upload small{display:block;font-size:11px;color:#7b8798;line-height:1.5}.btn{height:42px;border-radius:12px;border:1px solid #e8edf4;background:#fff;color:#39465d;font-weight:700;padding:0 14px}.btn.primary{background:#2463eb;border-color:#2463eb;color:#fff}.btn.soft{background:#eef4ff;border-color:transparent;color:#2463eb}.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.img{aspect-ratio:1;border-radius:11px;overflow:hidden;background:#eef2f7;position:relative}.img img{width:100%;height:100%;object-fit:cover}.rm{position:absolute;right:4px;top:4px;width:25px;height:25px;border-radius:50%;border:0;background:rgba(17,24,39,.75);color:#fff}.footer{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #e8edf4}.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0}.head{padding:14px 16px;border-bottom:1px solid #e8edf4;display:flex;align-items:center}.head h3{margin:0;font-size:17px}.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:50%;background:#f5f7fb;font-size:20px}.pHero{height:250px;background:linear-gradient(145deg,#edf2f7,#dbe4ef);display:grid;place-items:center;overflow:hidden}.pHero img{width:100%;height:100%;object-fit:cover}.ring{width:165px;height:65px;border:10px solid #303946;border-radius:50%;box-shadow:0 16px 28px rgba(255,205,81,.65)}.pBody{padding:16px}.pName{font-size:24px;font-weight:850}.pPrice{font-size:26px;color:#2463eb;font-weight:850;margin-top:10px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#2463eb}.desc{font-size:13px;line-height:1.75;color:#66748a;margin:14px 0}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{padding:10px;background:#f7f9fc;border-radius:10px;font-size:12px}.spec small{display:block;color:#8792a4;margin-bottom:4px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.qr{text-align:center;padding:24px}.qrbox{width:180px;height:180px;margin:0 auto 14px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 50%/16px 16px;border:8px solid #fff;outline:1px solid #ddd}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;display:none}.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="row"><div><h1>我的商品</h1><div class="sub">单商品体验版 · 纯离线</div></div><div class="tag">仅 1 个商品</div></div></header>
<main class="content">
<div class="hero"><h2>先把一个商品录完整</h2><p>上传图片、填写参数，保存后即可预览客户看到的产品详情。</p></div>
<section class="card"><h3>基本信息</h3><div class="field"><label>商品名称 *</label><input id="name" value="星轨环形吊灯"></div><div class="grid"><div class="field"><label>商品型号</label><input id="model" value="LD-1001"></div><div class="field"><label>建议零售价</label><input id="price" value="2680"></div></div><div class="grid"><div class="field"><label>商品系列</label><input id="series" value="星轨系列"></div><div class="field"><label>商品分类</label><input id="category" value="吊灯"></div></div><div class="field"><label>商品介绍</label><textarea id="desc">双环悬浮结构，线条简洁，灯光柔和均匀，支持无极调光与多种色温配置。</textarea></div></section>
<section class="card"><h3>商品图片</h3><div class="upload"><strong>上传商品图片</strong><small>第一张作为主图，最多 6 张。图片仅保存在本机。</small><input id="file" type="file" accept="image/*" multiple hidden><button class="btn soft" id="choose" type="button" style="margin-top:12px">选择图片</button></div><div class="imgs" id="imgs"></div></section>
<section class="card"><h3>规格参数</h3><div class="grid"><div class="field"><label>功率</label><input id="power" value="72W"></div><div class="field"><label>色温</label><input id="temp" value="3000K / 4000K"></div></div><div class="grid"><div class="field"><label>尺寸</label><input id="size" value="Ø800 × H120mm"></div><div class="field"><label>颜色</label><input id="color" value="哑光黑 / 香槟金"></div></div><div class="field"><label>展厅位置</label><input id="location" value="A区 01"></div></section>
<section class="card"><h3>二维码</h3><div style="font-size:12px;color:#7b8798;line-height:1.6">正式版二维码内容只保存商品标识，扫码后直接在 App 内打开本商品，不需要网络。</div><button class="btn" id="qrBtn" type="button" style="width:100%;margin-top:12px">查看商品二维码</button></section>
</main>
<footer class="footer"><button class="btn" id="preview" type="button">预览详情</button><button class="btn primary" id="save" type="button">保存商品</button></footer>
<div class="modal" id="previewModal"><div class="sheet"><div class="head"><h3>客户看到的商品详情</h3><button class="close" data-close="previewModal">×</button></div><div id="previewBody"></div></div></div>
<div class="modal" id="qrModal"><div class="sheet"><div class="head"><h3>商品二维码</h3><button class="close" data-close="qrModal">×</button></div><div class="qr"><div class="qrbox"></div><strong id="qrName">星轨环形吊灯</strong><div id="qrModel" style="font-size:12px;color:#7b8798;margin-top:5px">LD-1001</div><div style="font-size:12px;color:#7b8798;margin-top:12px">product://<span id="qrCode">LD-1001</span></div></div></div></div>
<div class="toast" id="toast">已保存</div>
</div>
<script>
(()=>{const $=s=>document.querySelector(s);let images=[];const ids=['name','model','price','series','category','desc','power','temp','size','color','location'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function load(){try{const d=JSON.parse(localStorage.getItem('singleProduct')||'null');if(d){ids.forEach(id=>{if(d[id]!=null)$('#'+id).value=d[id]});images=Array.isArray(d.images)?d.images:[];renderImgs()}}catch(e){}}
function save(){if(!$('#name').value.trim())return toast('请填写商品名称');const d={images};ids.forEach(id=>d[id]=$('#'+id).value);try{localStorage.setItem('singleProduct',JSON.stringify(d));toast('商品已保存到本机')}catch(e){toast('图片过大，请减少图片后再保存')}}
function renderImgs(){$('#imgs').innerHTML=images.map((src,i)=>`<div class="img"><img src="${src}"><button class="rm" type="button" data-i="${i}">×</button></div>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{images.splice(+b.dataset.i,1);renderImgs()})}
$('#choose').onclick=()=>$('#file').click();$('#file').onchange=e=>{const fs=[...e.target.files].slice(0,6-images.length);fs.forEach(f=>{if(!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=x=>{images.push(x.target.result);renderImgs()};r.readAsDataURL(f)});e.target.value=''};
function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});
$('#preview').onclick=()=>{const price=Number($('#price').value.replace(/,/g,''))||0;const hero=images[0]?`<img src="${images[0]}">`:'<div class="ring"></div>';const gallery=images.slice(1).map(x=>`<img src="${x}">`).join('');$('#previewBody').innerHTML=`<div class="pHero">${hero}</div><div class="pBody"><div class="pName">${$('#name').value||'未命名商品'}</div><div class="pills"><span class="pill">${$('#model').value||'-'}</span><span class="pill">${$('#series').value||'-'}</span><span class="pill">${$('#category').value||'-'}</span></div><div class="pPrice">¥${price.toLocaleString()}</div><div class="desc">${$('#desc').value||'暂无商品介绍'}</div><div class="specs"><div class="spec"><small>功率</small>${$('#power').value||'-'}</div><div class="spec"><small>色温</small>${$('#temp').value||'-'}</div><div class="spec"><small>尺寸</small>${$('#size').value||'-'}</div><div class="spec"><small>颜色</small>${$('#color').value||'-'}</div><div class="spec"><small>展厅位置</small>${$('#location').value||'-'}</div><div class="spec"><small>状态</small>展示中</div></div>${gallery?`<div class="gallery">${gallery}</div>`:''}</div>`;open('previewModal')};
$('#qrBtn').onclick=()=>{$('#qrName').textContent=$('#name').value||'未命名商品';$('#qrModel').textContent=$('#model').value||'-';$('#qrCode').textContent=$('#model').value||'PRODUCT-1';open('qrModal')};$('#save').onclick=save;ids.forEach(id=>$('#'+id).addEventListener('change',save));load();})();
</script>
</body></html>
